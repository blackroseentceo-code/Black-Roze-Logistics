    <style>
        :root {

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        .hero { max-width: 1000px; margin: 5rem auto 4rem; padding: 0 2rem; text-align: center; }

        .cta-group { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; }
        .btn-primary { background: var(--accent); color: white; padding: 0.85rem 1.75rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn-primary:hover { background: #2563eb; }
        .btn-secondary { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border); padding: 0.85rem 1.75rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: border-color 0.2s; }
        .btn-secondary:hover { border-color: var(--accent); }
        .highlights { max-width: 1100px; margin: 0 auto 4rem; padding: 0 2rem; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
        .highlight-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
        .highlight-card h2 { color: var(--accent); font-size: 1.2rem; margin-bottom: 0.65rem; }
        .highlight-card p { color: var(--text-muted); font-size: 0.95rem; }
        footer { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 4rem; }
        .footer-links { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1rem; }
            nav { gap: 1rem; flex-wrap: wrap; justify-content: center; }
            .hero h1 { font-size: 2.2rem; }
            .highlights { grid-template-columns: 1fr; }
        }
    </style>
