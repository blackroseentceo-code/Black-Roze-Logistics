<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Shippers | Black Roze Logistics</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { display: inline-flex; align-items: center; text-decoration: none; line-height: 0; }
        .logo img { height: 48px; width: auto; display: block; }
        
        nav { display: flex; gap: 1.5rem; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--accent); }
        .container { max-width: 1000px; margin: 4rem auto; padding: 0 2rem; }
        .page-title { text-align: center; margin-bottom: 3.5rem; }
        .page-title h1 { font-size: 2.5rem; font-weight: 800; margin-bottom: 0.75rem; }
        .page-title p { color: var(--text-muted); font-size: 1.1rem; max-width: 680px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-bottom: 3rem; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 2rem; }
        .card h2 { color: var(--accent); font-size: 1.25rem; margin-bottom: 0.75rem; }
        .card p { color: var(--text-muted); font-size: 0.95rem; }
        .cta-box { background: var(--card-bg); border: 1px solid rgba(59, 130, 246, 0.35); border-radius: 8px; padding: 2.5rem; text-align: center; }
        .cta-box h2 { font-size: 1.6rem; margin-bottom: 0.75rem; }
        .cta-box p { color: var(--text-muted); max-width: 600px; margin: 0 auto 1.5rem; }
        .btn { display: inline-block; background: var(--accent); color: white; padding: 0.8rem 1.75rem; border-radius: 6px; text-decoration: none; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }
        footer { text-align: center; padding: 3rem 1.5rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 4rem; }
        .footer-links { display: flex; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        .footer-links a { color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--accent); }
        @media (max-width: 640px) {
            header { flex-direction: column; gap: 1rem; }
            nav { gap: 1rem; flex-wrap: wrap; justify-content: center; }
            .grid { grid-template-columns: 1fr; }
            .page-title h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="logo" aria-label="Black Roze Logistics — Home"><img src="black-roze-logo-header.png" alt="Black Roze Logistics" height="48"></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="shippers.html" class="active">Shippers</a>
            <a href="quote.html">Quote</a>
            <a href="carriers.html">Carriers</a>
        </nav>
    </header>


    <div class="container">
        <div class="page-title">
            <h1>Ship With Confidence</h1>
            <p>Disciplined capacity sourcing, rigorous carrier vetting, and transparent communication from pickup to proof of delivery.</p>
