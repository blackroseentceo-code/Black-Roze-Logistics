<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote - Black Roze Logistics</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --accent: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: 1px; color: var(--text-main); text-transform: uppercase; }
        .logo span { color: var(--accent); }
        nav { display: flex; gap: 1.5rem; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: color 0.2s; }
        nav a:hover, nav a.active { color: var(--accent); }
        .container { max-width: 700px; margin: 4rem auto; background: var(--card-bg); border: 1px solid var(--border); padding: 2.5rem; border-radius: 8px; }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5r em; }
        p { color: var(--text-muted); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.95rem; }
        input, select, textarea { width: 100%; padding: 0.75rem; background: var(--bg-color); border: 1px solid var(--border); border-radius: 6px; color: var(--text-main); font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #2563eb; }
        footer { text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.85rem; border-top: 1px solid var(--border); margin-top: 4rem; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Black Roze <span>Logistics</span></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="shippers.html">Shippers</a>
            <a href="carriers.html">Carriers</a>
        </nav>
    </header>

    <div class="container">
        <h1>Request a Freight Quote</h1>
        <p>Fill out the details below to secure competitive pricing for your upcoming shipments.</p>
        
        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="company">Company Name</label>
                <input type="text" id="company" name="company" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="origin">Origin (City, State, or Zip)</label>
                <input type="text" id="origin" name="origin" required>
            </div>
            <div class="form-group">
                <label for="destination">Destination (City, State, or Zip)</label>
                <input type="text" id="destination" name="destination" required>
            </div>
            <div class="form-group">
                <label for="equipment">Equipment Type</label>
                <select id="equipment" name="equipment">
                    <option value="dry-van">Dry Van</option>
                    <option value="reefer">Reefer (Refrigerated)</option>
                    <option value="flatbed">Flatbed</option>
                    <option value="partial">Partial / LTL</option>
                </select>
            </div>
            <div class="form-group">
                <label for="notes">Commodity / Additional Details</label>
                <textarea id="notes" name="notes" rows="4"></textarea>
            </div>
            <button type="submit">Submit Quote Request</button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 Black Roze Logistics. All rights reserved. | MC & USDOT Setup Active</p>
    </footer>
</body>
</html>
